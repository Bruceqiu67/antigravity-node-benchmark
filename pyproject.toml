[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antigravity-node-benchmark"
version = "7.0.0"
description = "Zero-Risk, Multi-Platform Pragmatic Node Stability & Egress Diagnostic Benchmark for Google AI & Antigravity"
readme = "README.md"
authors = [{ name = "Bruceqiu67" }]
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = [
    "antigravity",
    "gemini",
    "google-ai",
    "clash",
    "mihomo",
    "flclash",
    "proxy-benchmark",
    "latency-test",
    "sing-box"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Software Development :: Testing",
]

[project.scripts]
antigravity-bench = "main:main"

[project.urls]
Homepage = "https://github.com/Bruceqiu67/antigravity-node-benchmark"
Repository = "https://github.com/Bruceqiu67/antigravity-node-benchmark"
